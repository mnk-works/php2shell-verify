[Session]
session.save_handler = files
session.save_path = /tmp/sess
session.use_strict_mode = 0
; Sharpest possible fixation test: NO cookies at all.
; If the SID still gets taken from the POST body, use_only_cookies is truly bypassed.
session.use_cookies = 0
session.use_only_cookies = 1
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 0
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

[PHP]
display_errors = On
error_reporting = E_ALL
memory_limit = 512M

[opcache]
zend_extension = opcache.so
opcache.enable = 1
opcache.preload = /srv/preload.php
opcache.preload_user = www-data
